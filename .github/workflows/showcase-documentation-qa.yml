name: Showcase Documentation QA

on:
  pull_request:
    paths:
      - "*.md"
      - "assets/**"
      - "scripts/check-showcase.mjs"
      - ".github/workflows/showcase-documentation-qa.yml"
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "assets/**"
      - "scripts/check-showcase.mjs"
      - ".github/workflows/showcase-documentation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-documentation-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check script syntax
        run: node --check scripts/check-showcase.mjs
      - name: Check local links and embedded assets
        run: node scripts/check-showcase.mjs
