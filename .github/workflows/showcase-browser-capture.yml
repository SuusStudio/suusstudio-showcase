name: Showcase Browser Capture

on:
  pull_request:
    paths:
      - "README.md"
      - "VERIFICATION.md"
      - "scripts/check-showcase-browser.mjs"
      - ".github/workflows/showcase-browser-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-read-only-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact Showcase PR head
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect browser script syntax
        run: node --check scripts/check-showcase-browser.mjs
      - name: Capture current production in Chromium
        run: node scripts/check-showcase-browser.mjs
      - name: Save screenshots and viewport measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-browser-capture
          path: browser-smoke-artifacts/
          retention-days: 7
