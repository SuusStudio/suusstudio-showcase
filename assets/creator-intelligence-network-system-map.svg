<text x="82" y="252" class="sans boxTitle" fill="#69bce8">1. USER / REQUEST</text>
<text x="82" y="292" class="sans body"><tspan x="82">A request enters the system.</tspan><tspan x="82" dy="27">Intent and required context</tspan><tspan x="82" dy="27">are captured.</tspan></text>
<text x="332" y="252" class="sans boxTitle" fill="#c89d58">2. GOVERNANCE</text>
<text x="332" y="292" class="sans body"><tspan x="332">Permissions, evidence and</tspan><tspan x="332" dy="27">rules are checked first.</tspan><tspan x="332" dy="27">No authority? STOP.</tspan></text>
<text x="582" y="252" class="sans boxTitle" fill="#78ca77">3. MULTI-AGENT ROUTING</text>
<text x="582" y="292" class="sans body"><tspan x="582">The system selects the</tspan><tspan x="582" dy="27">right specialist role(s)</tspan><tspan x="582" dy="27">for the job.</tspan></text>
<text x="832" y="252" class="sans boxTitle" fill="#69bce8">4. EXECUTION</text>
<text x="832" y="292" class="sans body"><tspan x="832">Agents perform the task</tspan><tspan x="832" dy="27">with approved tools and</tspan><tspan x="832" dy="27">shared run context.</tspan></text>
<text x="1082" y="252" class="sans boxTitle" fill="#a66cff">5. QA &amp; REPAIR</text>
<text x="1082" y="292" class="sans body"><tspan x="1082">Quality is scored.</tspan><tspan x="1082" dy="27">Weak results are blocked</tspan><tspan x="1082" dy="27">and repaired selectively.</tspan></text>
<text x="1332" y="252" class="sans boxTitle" fill="#78ca77">6. PROOF &amp; DELIVERY</text>
<text x="1332" y="292" class="sans body"><tspan x="1332">Only approved results</tspan><tspan x="1332" dy="27">move forward with a</tspan><tspan x="1332" dy="27">verifiable record.</tspan></text>
